name: Build SheetPrinter.exe

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Put the new version number inside the app
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "__version__ = \"$VERSION\"" > version.py
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build exe
        run: pyinstaller --onefile --windowed --name SheetPrinter --hidden-import win32timezone app.py

      - name: Publish new release automatically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" dist/SheetPrinter.exe --target "${{ github.sha }}" --title "v$VERSION" --notes "Automatic build"
